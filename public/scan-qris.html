<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scan QRIS</title>
<meta name="theme-color" content="#0c0404">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
:root{--bg:#F5F6F8;--card:#fff;--ink:#1F1F1F;--mute:#6B6B6B;--line:#EBEBEB;--or:#FA5B00;--warn:#F59A00;--warnbg:#FFF7E6;--ph:#E6E6E6;--bad:#D93025;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141516;--card:#1F2022;--ink:#F2F2F2;--mute:#A3A3A3;--line:#2D2E30;--warnbg:#2B2416;--ph:#2E2F31}}
:root[data-theme="dark"]{--bg:#141516;--card:#1F2022;--ink:#F2F2F2;--mute:#A3A3A3;--line:#2D2E30;--warnbg:#2B2416;--ph:#2E2F31}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{font:400 14px/1.4 Roboto,system-ui,sans-serif;color:var(--ink);background:#0c0404;-webkit-tap-highlight-color:transparent}
body.qr{background:var(--card)}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--or);outline-offset:2px}
svg.i{width:24px;height:24px;flex:none}
.app{position:relative;height:100%;max-width:430px;margin:0 auto;overflow:hidden;background:var(--bg)}
.scr{position:absolute;inset:0;display:none;flex-direction:column}
body.scan #s-scan,body.qr #s-qr{display:flex}
/* ===== Scan ===== */
#s-scan{background:linear-gradient(#2a2f2f,#140808 38%,#0c0404);color:#fff}
#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hd{position:relative;z-index:2;height:58px;display:flex;align-items:center;gap:14px;padding:0 12px 0 14px;flex:none}
.hd h1{font-size:18px;font-weight:700}
.frame{position:absolute;left:50%;top:21%;width:min(80vw,344px);aspect-ratio:1;transform:translateX(-50%);box-shadow:0 0 0 200vmax rgba(10,3,3,.74)}
.c{position:absolute;width:19px;height:19px;border:3px solid #FF6A00}
.c1{top:-2px;left:-2px;border-right:0;border-bottom:0}.c2{top:-2px;right:-2px;border-left:0;border-bottom:0}
.c3{bottom:-2px;left:-2px;border-right:0;border-top:0}.c4{bottom:-2px;right:-2px;border-left:0;border-top:0}
.lbl{position:absolute;top:calc(100% + 22px);left:-20%;right:-20%;text-align:center;font-size:14px;display:flex;justify-content:center;align-items:center;gap:6px}
.lbl b{font-weight:700;letter-spacing:.5px;border:1.5px solid #fff;padding:0 4px;font-size:12px;line-height:16px}
.bar{position:absolute;left:0;right:0;bottom:56px;z-index:2;display:flex;justify-content:space-between;align-items:flex-start;padding:0 20px}
.ctl{display:flex;flex-direction:column;align-items:center;gap:6px;width:76px;color:#fff;font-size:14px}
.ctl i{width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center}
.ctl svg{width:22px;height:22px}
.ctl.on i{background:#FF6A00}
.pill{height:37px;padding:0 24px 0 18px;border-radius:19px;background:rgba(0,0,0,.55);display:flex;align-items:center;gap:10px;color:#fff;font-size:14px}
.pill svg{width:22px;height:22px}
.camfix{position:absolute;inset:0;margin:auto;width:max-content;height:40px;padding:0 22px;border-radius:20px;background:#FF6A00;color:#fff;z-index:3}
/* ===== QR Code ===== */
#s-qr{background:var(--bg)}
#s-qr .hd{background:var(--card);height:47px;padding:0 15px 0 12px;justify-content:space-between;color:var(--ink)}
#s-qr .hd div{display:flex;align-items:center;gap:14px}
#s-qr .hd h1{font-weight:500}
.help{width:33px;height:33px;border:1px solid #bbb;border-radius:50%;display:grid;place-items:center}
.help svg{width:20px;height:20px}
.main{flex:1;overflow:auto;padding:15px 15px 12px}
.main>p{color:var(--mute);margin-bottom:16px;padding:0 0 0 0}
.card{background:var(--card);border-radius:8px;padding:20px 20px 22px;text-align:center}
.exp{display:flex;justify-content:center;align-items:center;gap:6px;color:var(--warn);margin-bottom:26px}
.exp svg{width:17px;height:17px}.exp b{font-weight:700}
.ph{width:62px;margin:0 auto 22px;display:block}
.card h2{font-size:18px;font-weight:700;color:var(--mute);margin-bottom:22px}
.retry{height:37px;padding:0 24px;border:1px solid var(--or);border-radius:4px;color:var(--or)}
.card hr{border:0;border-top:1px solid var(--line);margin:18px 0 16px}
.card small{display:block;font-size:14px;color:var(--mute);padding:0 14px;line-height:1.45}
.limit{display:flex;align-items:center;gap:10px;background:var(--warnbg);border-radius:8px;padding:12px 15px;margin-top:8px}
.limit svg{width:20px;height:20px}
.foot{padding:12px;background:var(--card);border-top:1px solid var(--line);flex:none}
.cta{display:block;width:100%;height:49px;border-radius:8px;background:var(--or);color:#fff;font-size:16px}
/* ===== Sheet ===== */
.shade{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:5}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;background:var(--card);color:var(--ink);border-radius:16px 16px 0 0;padding:18px 16px 16px;transform:translateY(105%);transition:transform .25s;max-height:92%;overflow:auto}
.app.open .shade{opacity:1;pointer-events:auto}.app.open .sheet{transform:none}
.tag{display:inline-block;font-size:12px;font-weight:500;padding:2px 10px;border-radius:10px;background:var(--warnbg);color:var(--warn);margin-bottom:8px}
.sheet h3{font-size:18px;font-weight:700}
.sheet .sub{color:var(--mute);margin-bottom:12px}
.rows{border-top:1px solid var(--line);padding:6px 0;margin-bottom:10px}
.r{display:flex;justify-content:space-between;gap:16px;padding:5px 0}
.r span:first-child{color:var(--mute)}.r span:last-child{text-align:right;word-break:break-all}
.amt{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:0 12px;height:52px;font-size:20px;font-weight:500;margin:4px 0 10px;background:var(--bg)}
.amt input{flex:1;min-width:0;border:0;background:none;font-size:20px;font-weight:500;outline:0}
.amt:focus-within{border-color:var(--or)}
.tot{display:flex;justify-content:space-between;font-weight:700;font-size:16px;padding:8px 0}
.err{color:var(--bad);min-height:20px;font-size:13px}
.cta:disabled{opacity:.4;cursor:not-allowed}
.ghost{display:block;margin:8px auto 0;color:var(--mute);height:36px}
.toast{position:absolute;left:50%;bottom:130px;transform:translateX(-50%);z-index:9;max-width:86%;background:rgba(30,30,30,.92);color:#fff;padding:9px 16px;border-radius:20px;text-align:center;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body class="scan">

<symbol id="back" viewBox="0 0 24 24"><path d="M15 4 7 12l8 8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>

<symbol id="help" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M17 18.5c0-3.5 3-6 7-6s6.5 2.2 6.5 5.5c0 4.3-5.5 4.4-5.5 9"/></g><circle cx="25" cy="35" r="1.8" fill="currentColor"/></symbol>
<symbol id="clock" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="16" cy="16" r="13"/><path d="M16 9v7.5l4.5 3"/></g></symbol>

</svg>

<div class="app" id="app">
  <!-- Layar 1: Scan QRIS -->
  <section class="scr" id="s-scan">
    <video id="cam" playsinline muted></video>
    <header class="hd">
      <button id="b-back" aria-label="Kembali"><svg class="i"><use href="#back"/></svg></button>
      <h1>Scan QRIS</h1>
    </header>
    <div class="frame">
      <i class="c c1"></i><i class="c c2"></i><i class="c c3"></i><i class="c c4"></i>
      <div class="lbl">Scan Kode <b>QRIS</b></div>
      <button class="camfix" id="camfix" hidden>Buka kamera</button>
    </div>
    <div class="bar">
      <button class="ctl" id="flash"><i><svg><use href="#flash"/></svg></i>Flash</button>
      <button class="pill" id="b-show"><svg><use href="#showqr"/></svg>Tampilkan QR</button>
      <button class="ctl" id="b-gal"><i><svg><use href="#gallery"/></svg></i>Galeri</button>
    </div>
    <input type="file" id="file" accept="image/*" hidden>
    <input type="file" id="cap" accept="image/*" capture="environment" hidden>
  </section>

  <!-- Layar 2: QR Code -->
  <section class="scr" id="s-qr">
    <header class="hd">
      <div><button id="q-back" aria-label="Kembali"><svg class="i"><use href="#back"/></svg></button><h1>QR Code</h1></div>
      <button class="help" id="b-help" aria-label="Bantuan"><svg><use href="#help"/></svg></button>
    </header>
    <div class="main">
      <p>Tunjukkan QR Code ini ke kasir untuk menyelesaikan pembayaran.</p>
      <div class="card">
        <div class="exp"><svg><use href="#clock"/></svg>Kedaluwarsa dalam <b>--:--</b></div>
        <svg class="ph" viewBox="0 0 128 116" aria-hidden="true"><rect x="112" y="6" width="12" height="104" rx="3" fill="var(--ph)" opacity=".6"/><rect x="4" width="112" height="112" rx="4" fill="var(--ph)"/><g fill="none" stroke="var(--card)" stroke-width="8"><rect x="22" y="22" width="26" height="26" rx="2"/><rect x="62" y="22" width="26" height="26" rx="2"/><rect x="22" y="62" width="26" height="26" rx="2"/></g><g fill="#F96A00"><rect x="64" y="64" width="9" height="9"/><rect x="80" y="64" width="9" height="9"/><rect x="72" y="76" width="9" height="9"/><rect x="82" y="88" width="9" height="9"/></g></svg>
        <h2>Tidak dapat memuat kode QR</h2>
        <button class="retry" id="b-retry">Muat Ulang</button>
        <hr>
        <small>Demi alasan keamanan, jangan membagikan QR Code dengan siapapun.</small>
      </div>
      <div class="limit"><svg><use href="#bell"/></svg><span id="limit-t"></span></div>
    </div>
    <div class="foot"><button class="cta" id="b-toscan">Scan QRIS</button></div>
  </section>

  <div class="shade" id="shade"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Detail pembayaran"></div>
  <div class="toast" id="toast" role="status"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script>
/* ================= KONFIGURASI ================= */
const CONFIG = {
  allowStatic: true,        // QRIS statis (tag 01 = 11)
  allowDynamic: true,       // QRIS dinamis (tag 01 = 12)
  requireValidCRC: true,    // tolak jika CRC16 tidak cocok
  currency: '360',          // IDR
  country: 'ID',
  minAmount: 1,
  maxAmount: 10000000,      // limit pembayaran
  scanIntervalMs: 120,
  onPay(p){ console.log('QRIS siap dibayar', p); window.dispatchEvent(new CustomEvent('qris:pay', {detail: p})); },
  onClose(){ if (history.length > 1) history.back(); else location.href = 'index.html'; }
};

/* ================= PARSER QRIS (EMVCo MPM) ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp = n => 'Rp' + Math.round(n).toLocaleString('id-ID');

function tmap(s){
  const m = {}; let i = 0;
  while (i < s.length){
    const t = s.substr(i, 2), l = parseInt(s.substr(i + 2, 2), 10);
    if (isNaN(l) || i + 4 + l > s.length) throw new Error('TLV rusak');
    m[t] = s.substr(i + 4, l); i += 4 + l;
  }
  return m;
}
function crc16(s){ // CRC-16/CCITT-FALSE
  let c = 0xFFFF;
  for (let i = 0; i < s.length; i++){
    c ^= s.charCodeAt(i) << 8;
    for (let j = 0; j < 8; j++) c = (c & 0x8000) ? ((c << 1) ^ 0x1021) & 0xFFFF : (c << 1) & 0xFFFF;
  }
  return c.toString(16).toUpperCase().padStart(4, '0');
}
function parseQris(raw){
  raw = String(raw).trim();
  if (!/^000201/.test(raw)) throw new Error('Ini bukan kode QRIS.');
  const i = raw.lastIndexOf('6304');
  if (i < 0 || raw.length !== i + 8) throw new Error('Struktur QRIS tidak lengkap.');
  const crcOk = crc16(raw.slice(0, i + 4)) === raw.slice(i + 4).toUpperCase();
  if (CONFIG.requireValidCRC && !crcOk) throw new Error('CRC QRIS tidak cocok. Pindai ulang.');
  let t; try { t = tmap(raw); } catch (e) { throw new Error('Data QRIS tidak terbaca.'); }
  const type = t['01'] === '11' ? 'static' : t['01'] === '12' ? 'dynamic' : null;
  if (!type) throw new Error('Jenis QRIS tidak dikenali.');
  if (type === 'static' && !CONFIG.allowStatic) throw new Error('QRIS statis tidak diterima.');
  if (type === 'dynamic' && !CONFIG.allowDynamic) throw new Error('QRIS dinamis tidak diterima.');
  if (t['53'] && t['53'] !== CONFIG.currency) throw new Error('Mata uang bukan rupiah.');
  if (t['58'] && t['58'] !== CONFIG.country) throw new Error('QRIS ini bukan untuk merchant Indonesia.');
  let nmid = '', crit = '', pjsp = '';
  for (let k = 26; k <= 51; k++){
    const v = t[String(k)]; if (!v) continue;
    let s; try { s = tmap(v); } catch (e) { continue; }
    Object.values(s).forEach(x => { if (/^ID\d{10,}$/.test(x)) nmid = nmid || x; });
    if (k === 51) crit = s['03'] || '';
    else if (!pjsp) pjsp = (s['00'] || '').split('.')[2] || s['00'] || '';
  }
  let add = {}; try { add = t['62'] ? tmap(t['62']) : {}; } catch (e) {}
  return {
    raw, crcOk, type, merchant: t['59'] || '-', city: t['60'] || '', mcc: t['52'] || '',
    amount: t['54'] ? parseFloat(t['54']) : null,
    tipInd: t['55'] || '', feeFixed: t['56'] ? parseFloat(t['56']) : 0, feePct: t['57'] ? parseFloat(t['57']) : 0,
    nmid, crit, pjsp, bill: add['01'] || '', store: add['03'] || '', ref: add['05'] || '', terminal: add['07'] || ''
  };
}

/* ================= STATE & NAVIGASI ================= */
const S = {mode: 'scan', paused: false, stream: null, torch: false, det: null, timer: 0, q: null};
const cv = document.createElement('canvas'), cx = cv.getContext('2d', {willReadFrequently: true});
let toastT;
function toast(m){ const e = $('#toast'); e.textContent = m; e.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => e.classList.remove('on'), 2600); }
function go(m){ S.mode = m; document.body.className = m; if (m === 'scan') startCam(); else stopCam(); }

/* ================= KAMERA & DETEKSI ================= */
(async () => {
  try { if ('BarcodeDetector' in window){ const f = await BarcodeDetector.getSupportedFormats(); if (f.includes('qr_code')) S.det = new BarcodeDetector({formats: ['qr_code']}); } } catch (e) {}
})();

async function startCam(){
  if (S.stream) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ camFail(window.isSecureContext ? 'Kamera tidak tersedia di sini.' : 'Kamera butuh koneksi HTTPS.'); return; }
  try {
    S.stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: {ideal: 'environment'}, width: {ideal: 1280}, height: {ideal: 720}}, audio: false});
    const v = $('#cam'); v.srcObject = S.stream; await v.play();
    S.paused = false; $('#camfix').hidden = true; tick();
  } catch (e) { S.stream = null; camFail(e && e.name === 'NotAllowedError' ? 'Izin kamera diblokir. Ketuk Buka kamera.' : 'Kamera tidak bisa dibuka. Ketuk Buka kamera.'); }
}
function camFail(m){ toast(m); $('#camfix').hidden = false; }
function stopCam(){
  clearTimeout(S.timer);
  if (S.stream) S.stream.getTracks().forEach(t => t.stop());
  S.stream = null; S.torch = false; $('#flash').classList.remove('on');
}
async function tick(){
  if (S.mode !== 'scan' || S.paused || !S.stream) return;
  try {
    const v = $('#cam'); let raw = '';
    if (v.readyState >= 2 && v.videoWidth){
      if (S.det){ const r = await S.det.detect(v); raw = r[0] ? r[0].rawValue : ''; }
      else if (window.jsQR){
        const w = Math.min(640, v.videoWidth), h = Math.round(w * v.videoHeight / v.videoWidth);
        cv.width = w; cv.height = h; cx.drawImage(v, 0, 0, w, h);
        const r = jsQR(cx.getImageData(0, 0, w, h).data, w, h, {inversionAttempts: 'attemptBoth'}); raw = r ? r.data : '';
      }
    }
    if (raw) handleRaw(raw);
  } catch (e) {}
  S.timer = setTimeout(tick, CONFIG.scanIntervalMs);
}
async function fromFile(f){
  if (!f) return;
  try {
    const bmp = await createImageBitmap(f); let raw = '';
    for (const m of [1600, 900, 500]){
      const sc = Math.min(1, m / Math.max(bmp.width, bmp.height)), w = Math.round(bmp.width * sc), h = Math.round(bmp.height * sc);
      cv.width = w; cv.height = h; cx.drawImage(bmp, 0, 0, w, h);
      if (S.det){ const r = await S.det.detect(cv); raw = r[0] ? r[0].rawValue : ''; }
      if (!raw && window.jsQR){ const r = jsQR(cx.getImageData(0, 0, w, h).data, w, h, {inversionAttempts: 'attemptBoth'}); raw = r ? r.data : ''; }
      if (raw) break;
    }
    raw ? handleRaw(raw) : toast('Tidak ada kode QR pada gambar itu.');
  } catch (e) { toast('Gambar tidak bisa dibaca.'); }
}
let lastBad = 0;
function handleRaw(raw){
  try { const q = parseQris(raw); S.paused = true; clearTimeout(S.timer); if (navigator.vibrate) navigator.vibrate(40); openSheet(q); }
  catch (e){ if (Date.now() - lastBad > 2500){ lastBad = Date.now(); toast(e.message); } }
}

/* ================= SHEET PEMBAYARAN ================= */
const digits = s => parseInt(String(s).replace(/\D/g, ''), 10) || 0;
function row(k, v){ return v ? '<div class="r"><span>' + k + '</span><span>' + esc(v) + '</span></div>' : ''; }
function openSheet(q){
  S.q = q; const fixed = q.amount != null;
  $('#sheet').innerHTML =
    '<span class="tag">' + (q.type === 'dynamic' ? 'QRIS Dinamis' : 'QRIS Statis') + '</span>' +
    '<h3>' + esc(q.merchant) + '</h3><div class="sub">' + esc(q.city) + '</div>' +
    '<div class="rows">' + row('NMID', q.nmid) + row('Penyelenggara', q.pjsp) + row('Kategori', q.crit) + row('Toko', q.store) + row('Terminal', q.terminal) + row('No. tagihan', q.bill) + row('Referensi', q.ref) + '</div>' +
    (fixed ? '<div class="r"><span>Nominal</span><span>' + rp(q.amount) + '</span></div>'
           : '<label for="amt">Nominal pembayaran</label><div class="amt">Rp<input id="amt" inputmode="numeric" placeholder="0" autocomplete="off"></div>') +
    (q.tipInd === '01' ? '<label for="tip">Tip (opsional)</label><div class="amt">Rp<input id="tip" inputmode="numeric" placeholder="0" autocomplete="off"></div>' : '') +
    '<div class="r" id="feeR" hidden><span>Biaya layanan</span><span id="fee"></span></div>' +
    '<div class="tot"><span>Total</span><span id="tot">Rp0</span></div>' +
    '<div class="err" id="err"></div>' +
    '<button class="cta" id="pay">Bayar</button><button class="ghost" id="again">Pindai ulang</button>';
  $('#app').classList.add('open');
  ['amt', 'tip'].forEach(id => { const e = $('#' + id); if (e) e.addEventListener('input', () => { e.value = digits(e.value) ? digits(e.value).toLocaleString('id-ID') : ''; calc(); }); });
  $('#pay').onclick = pay; $('#again').onclick = closeSheet; calc();
  const a = $('#amt'); if (a) a.focus();
}
function calc(){
  const q = S.q, base = q.amount != null ? q.amount : digits(($('#amt') || {}).value);
  const tip = q.tipInd === '01' ? digits(($('#tip') || {}).value) : 0;
  let fee = 0;
  if (q.tipInd === '03' || (!q.tipInd && q.feePct)) fee = base * q.feePct / 100;
  else if (q.tipInd === '02' || (!q.tipInd && q.feeFixed)) fee = q.feeFixed;
  fee = Math.round(fee); const total = base + fee + tip;
  $('#feeR').hidden = !fee; $('#fee').textContent = rp(fee); $('#tot').textContent = rp(total);
  let err = '';
  if (base < CONFIG.minAmount) err = q.amount == null ? 'Masukkan nominal pembayaran.' : 'Nominal tidak valid.';
  else if (total > CONFIG.maxAmount) err = 'Melebihi limit pembayaran ' + rp(CONFIG.maxAmount) + '.';
  $('#err').textContent = err; $('#pay').disabled = !!err;
  S.pay = {base, fee, tip, total};
}
function pay(){ CONFIG.onPay({qris: S.q, ...S.pay}); toast('Pembayaran diteruskan ke onPay().'); }
function closeSheet(){ $('#app').classList.remove('open'); S.paused = false; if (S.mode === 'scan' && S.stream) tick(); }

/* ================= EVENT ================= */
$('#camfix').onclick = async () => { await startCam(); if (!S.stream) $('#cap').click(); };
$('#cap').onchange = e => { fromFile(e.target.files[0]); e.target.value = ''; };
$('#b-back').onclick = () => CONFIG.onClose();
$('#q-back').onclick = $('#b-toscan').onclick = () => go('scan');
$('#b-show').onclick = () => go('qr');
$('#b-gal').onclick = () => $('#file').click();
$('#file').onchange = e => { fromFile(e.target.files[0]); e.target.value = ''; };
$('#shade').onclick = closeSheet;
$('#b-help').onclick = () => toast('Arahkan kamera ke QRIS merchant, atau pilih gambar dari Galeri.');
$('#limit-t').textContent = 'Limit pembayaran: sampai ' + CONFIG.maxAmount.toLocaleString('id-ID');
$('#b-retry').onclick = function(){
  this.disabled = true; this.textContent = 'Memuat…';
  setTimeout(() => { this.disabled = false; this.textContent = 'Muat Ulang'; toast('Belum bisa memuat. Hubungkan layanan QR pembayaran Anda.'); }, 900);
};
$('#flash').onclick = async function(){
  const tr = S.stream && S.stream.getVideoTracks()[0];
  if (!tr || !(tr.getCapabilities && tr.getCapabilities().torch)){ toast('Flash tidak didukung perangkat ini.'); return; }
  try { S.torch = !S.torch; await tr.applyConstraints({advanced: [{torch: S.torch}]}); this.classList.toggle('on', S.torch); }
  catch (e) { S.torch = false; toast('Flash tidak bisa dinyalakan.'); }
};
document.addEventListener('visibilitychange', () => { if (document.hidden) stopCam(); else if (S.mode === 'scan' && !$('#app').classList.contains('open')) startCam(); });
/* Uji tanpa kamera: buka halaman dengan #qris=<payload> */
if (location.hash.startsWith('#qris=')) handleRaw(decodeURIComponent(location.hash.slice(6)));
go('scan');
</script>
<script src="pwa.js"></script>
</body>
