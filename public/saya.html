<script type="module">
/* Dx ANUBIS — Realtime foreground notification + bell + speech queue.
   Push saat aplikasi tertutup memerlukan SW dan backend Web Push yang aktif. */
const SUPABASE_URL='https://jtdnsrsollmknfijdqty.supabase.co';
const SUPABASE_KEY='sb_publishable_kFtJtS9LwGLmnaq_jvv2HQ_7KlhluBn';
const SUPABASE_ESM='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/+esm';
const toastEl=document.createElement('div');toastEl.id='dx-live-toast';toastEl.setAttribute('role','status');toastEl.setAttribute('aria-live','polite');document.body.appendChild(toastEl);
let audioCtx=null,queue=[],speaking=false,connected=false;const seen=new Set();let toastTimer;
function toast(msg,error=false){toastEl.textContent=msg;toastEl.classList.toggle('error',error);toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),4500)}
async function unlockAudio(){const C=window.AudioContext||window.webkitAudioContext;if(!C){toast('Perangkat tidak mendukung audio Web.');return}try{audioCtx??=new C();if(audioCtx.state==='suspended')await audioCtx.resume();toast('Audio notifikasi Dx siap.')}catch(e){toast('Audio belum dapat diaktifkan.',true)}}
function bellOneSecond(){return new Promise(resolve=>{if(!audioCtx||audioCtx.state!=='running'){setTimeout(resolve,1000);return}const t=audioCtx.currentTime+.025;[1046.5,1568,2093].forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.15/(i+1),t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+.9);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+.94)});setTimeout(resolve,1000)})}
function speakText(text){return new Promise(resolve=>{if(!('speechSynthesis'in window)){resolve();return}const u=new SpeechSynthesisUtterance(text);u.lang='id-ID';u.rate=.94;u.pitch=1;u.volume=1;let done=false;const finish=()=>{if(done)return;done=true;resolve()};u.onend=finish;u.onerror=finish;window.speechSynthesis.speak(u);setTimeout(finish,Math.max(15000,text.length*130))})}
async function runQueue(){if(speaking||!queue.length)return;speaking=true;const n=queue.shift();try{await bellOneSecond();await speakText(n.judul+'. '+n.teks)}catch(e){console.warn('[Dx audio]',e)}speaking=false;runQueue()}
function notifyDevice(n){if('Notification'in window&&Notification.permission==='granted'&&document.visibilityState!=='visible'){try{new Notification(n.judul,{body:n.teks,tag:'dx-'+n.id,icon:'icons/apple-touch-icon.png'})}catch(e){}}}
function onBroadcast(message){let row=message?.payload??message?.row??message;if(row?.row)row=row.row;if(!row||row.id==null)return;const id=String(row.id);if(seen.has(id))return;seen.add(id);if(seen.size>500)seen.delete(seen.values().next().value);const n={id,judul:String(row.judul||'Notifikasi Dx'),teks:String(row.teks||'Ada data baru pada Dx ANUBIS.')};toast(n.judul+' — '+n.teks);notifyDevice(n);queue.push(n);runQueue()}
const bell=document.querySelector('.hdr .bl');if(bell){bell.addEventListener('click',async()=>{await unlockAudio();if('Notification'in window&&Notification.permission==='default'){try{const p=await Notification.requestPermission();toast(p==='granted'?'Izin notifikasi perangkat aktif.':'Izin notifikasi tidak diberikan.')}catch(e){}}});bell.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();bell.click()}})}
document.addEventListener('pointerdown',()=>{if(!audioCtx)unlockAudio()},{once:true,passive:true});
try{const {createClient}=await import(SUPABASE_ESM);const sb=createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false},realtime:{params:{eventsPerSecond:10}}});const ch=sb.channel('dx',{config:{broadcast:{self:false}}});ch.on('broadcast',{event:'notif'},onBroadcast).subscribe(status=>{if(status==='SUBSCRIBED'){connected=true;toast('Dx ANUBIS terhubung. Menunggu data baru.')}else if(['CHANNEL_ERROR','TIMED_OUT','CLOSED'].includes(status)){connected=false;console.warn('[Dx Realtime]',status)}});window.DxANUBIS={status:()=>connected?'connected':'disconnected',unlockAudio,stopVoice:()=>{queue=[];if('speechSynthesis'in window)window.speechSynthesis.cancel()}}}catch(e){console.error('[Dx Realtime]',e);toast('Koneksi Dx gagal. Periksa jaringan atau konfigurasi Supabase.',true)}
</script>
