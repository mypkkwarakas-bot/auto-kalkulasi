<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tanya SeaBank</title>
<meta name="theme-color" content="#ffffff">
<style>
/* Transisi antarhalaman (cross-document View Transitions): browser yang belum mendukung mengabaikannya */
@view-transition{navigation:auto}
@media (prefers-reduced-motion:no-preference){
  ::view-transition-old(root){animation:.16s ease-in both vt-out}
  ::view-transition-new(root){animation:.22s ease-out both vt-in}
}
@keyframes vt-out{to{opacity:0}}
@keyframes vt-in{from{opacity:0;transform:translateY(10px)}}
:root{--org:#fc5d00;--blue:#1a63ff;--ink:#222;--bg:#f7f7f7;--line:#ebebeb;--peach:#fff3ea}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Roboto,"Segoe UI",Helvetica,Arial,sans-serif;background:#e9e9e9;color:var(--ink);display:flex;justify-content:center}
.app{width:100%;max-width:420px;height:100%;display:flex;flex-direction:column;background:var(--bg)}
header{display:flex;align-items:center;gap:12px;height:calc(52px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 14px 0 14px;background:#fff;border-bottom:1px solid #e4e4e4;flex:none}
header button,header .back{background:none;border:0;padding:4px;display:flex;cursor:pointer}
header .back{padding:10px;margin:-6px}
.avatar{width:37px;height:37px;border-radius:50%;background:#f1f1f1;border:1px solid #ddd;overflow:hidden;flex:none}
header h1{font-size:16px;font-weight:500}
#msgs{flex:1;overflow-y:auto;padding:14px 0 12px;scroll-behavior:smooth}
.row{display:flex;align-items:flex-start;padding:0 14px;margin-top:12px}
.row:first-child{margin-top:0}
.row.user{justify-content:flex-end}
.bub{position:relative;background:#fff;border-radius:8px;padding:10px 12px;font-size:15px;line-height:18.5px;max-width:80%;white-space:pre-line;word-break:break-word}
.row.bot .bub::before,.row.user .bub::before{content:"";position:absolute;top:0;width:8px;height:9px;background:inherit}
.row.bot .bub::before{left:-7px;clip-path:polygon(0 0,100% 0,100% 100%)}
.row.user .bub{background:var(--peach)}
.row.user .bub::before{right:-7px;clip-path:polygon(0 0,100% 0,0 100%)}
.fb{display:flex;flex-direction:column;gap:7px;margin-left:7px;flex:none}
.fb button{width:30px;height:30px;border:0;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.fb svg{fill:#b0b0b0;width:19px;height:19px}
.fb button.on svg{fill:var(--org)}
.fb .dn svg{transform:rotate(180deg)}
.act{display:block;width:100%;margin-top:10px;border:0;border-radius:2px;background:var(--org);color:#fff;font:inherit;font-size:14px;height:33px;cursor:pointer}
.cats{display:flex;gap:7.5px;overflow-x:auto;padding:0 14px;margin-top:12px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;width:100px;height:93px;background:#fff;border:0;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;font:inherit;font-size:12px;line-height:13.5px;color:#777;text-align:center;cursor:pointer;padding:0 4px}
.cat i{width:33px;height:33px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.card{background:#fff;border-radius:8px;width:80%;padding-top:16px}
.row.cardrow{display:block}
.card h2{font-size:14.5px;font-weight:600;line-height:18.5px;padding:0 13px 14px}
.card .list{margin:0 2px 0 12px}
.card .o{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:13px 10px 13px 1px;font:inherit;font-size:15px;line-height:18.5px;color:var(--blue);cursor:pointer}
.card .o:disabled{cursor:default}
.card .swap{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:13px 0 14px;font:inherit;font-size:15px;color:var(--org);cursor:pointer}
.typing{display:flex;gap:4px;padding:5px 2px}
.typing span{width:7px;height:7px;border-radius:50%;background:#bbb;animation:b 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-4px)}}
.foot{background:#fff;flex:none;border-top:1px solid #efefef}
.chips{display:flex;gap:8px;overflow-x:auto;padding:11px 12px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid #d2d2d2;background:#fff;border-radius:16px;height:26px;padding:0 11px;font:inherit;font-size:13.5px;color:#555;cursor:pointer;white-space:nowrap}
.bar{display:flex;align-items:center;gap:10px;padding:6px 12px calc(12px + env(safe-area-inset-bottom,0px))}
.bar input{flex:1;min-width:0;height:35px;border:1px solid #d2d2d2;background:#fff;border-radius:18px;padding:0 12px;font:inherit;font-size:14.5px;color:var(--ink);outline:0}
.bar input:focus{border-color:var(--org)}
.bar input::placeholder{color:#bdbdbd}
.send{background:none;border:0;padding:2px;cursor:pointer;display:flex}
.send svg{width:26px;height:26px;fill:#ffa468;transition:fill .15s}
.send.on svg{fill:var(--org)}
button:focus-visible{outline:2px solid var(--org);outline-offset:2px}
@media(prefers-reduced-motion:reduce){#msgs{scroll-behavior:auto}.typing span{animation:none}}
.app{position:relative}
.bub b{font-weight:700}
.qr{display:block;width:100%;margin-top:10px;border:1px solid var(--org);border-radius:3px;background:#fff;color:var(--org);font:inherit;font-size:15px;height:36px;cursor:pointer}
.qr:disabled{opacity:.45;cursor:default}
.tx{background:#fff;border-radius:6px;padding:12px 14px;min-width:230px;text-align:left}
.tx .l1{display:flex;justify-content:space-between;gap:12px;font-size:15px}
.tx small{display:block;color:#777;font-size:14px;margin-top:3px}
.tx .d{color:#999;font-size:13px}
.row.user .bub.txb{padding:6px}
.sheet{position:absolute;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;z-index:5}
.sheet>div{background:#fff;width:100%;border-radius:14px 14px 0 0;max-height:70%;overflow:auto;padding:14px 0 calc(14px + env(safe-area-inset-bottom,0px))}
.sheet h3{font-size:15px;font-weight:600;padding:0 16px 10px}
.sheet button{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:6px 10px;font:inherit;cursor:pointer}
</style>
</head>

const THUMB='<svg viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.100-.9-2-2-2h-6.310l.95-4.570.03-.32c0-.41-.17-.79-.44-1.060L14.170 1 7.590 7.590C7.220 7.950 7 8.450 7 9v10c0 1.100.9 2 2 2h9c.83 0 1.540-.5 1.840-1.220l3.020-7.050c.09-.23.14-.47.14-.73v-2z"/></svg>';

// ===================== STATE & UTIL =====================
const $=id=>document.getElementById(id), msgs=$("msgs");
const history=[]; let si=0, busy=false, msgSeq=0;
const mk=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e};
const row=cls=>{const r=mk("div","row "+cls);msgs.appendChild(r);return r};
const down=()=>{msgs.scrollTop=msgs.scrollHeight};
const sessionId=(()=>{try{let s=sessionStorage.getItem("cs_session");if(!s){s=crypto.randomUUID();sessionStorage.setItem("cs_session",s)}return s}catch(e){return (crypto.randomUUID&&crypto.randomUUID())||String(Date.now())}})();
document.title=CONFIG.BRAND; $("title").textContent=CONFIG.BRAND;

// ===================== RENDER =====================
function userBubble(text){const r=row("user"),b=mk("div","bub");b.textContent=text;r.appendChild(b);down()}
function botBubble(m){
  const id=++msgSeq, r=row("bot"), b=mk("div","bub");
  rich(b,m.reply||"");
  if(m.action&&m.action.label){const a=mk("button","act");a.textContent=m.action.label;a.onclick=()=>CONFIG.onAction(m.action.name||m.action.label,{session_id:sessionId,message_id:id});b.appendChild(a)}
  (m.qr||[]).forEach(q=>{const x=mk("button","qr");x.textContent=q.label;x.onclick=()=>{b.querySelectorAll(".qr").forEach(y=>y.disabled=true);pick(q.label,q.fn)};b.appendChild(x)});
  r.appendChild(b);
  if(m.feedback){
    const f=mk("div","fb"),u=mk("button","up",THUMB),d=mk("button","dn",THUMB);
    u.setAttribute("aria-label","Membantu");d.setAttribute("aria-label","Kurang membantu");
    [[u,"up"],[d,"down"]].forEach(([x,v])=>x.onclick=()=>{u.classList.remove("on");d.classList.remove("on");x.classList.add("on");sendFeedback(id,v,m.reply)});
    f.append(u,d);r.appendChild(f);
  }
  history.push({role:"assistant",content:m.reply||""});down();
}
function cardBubble(c){
  const r=row("bot cardrow"),card=mk("div","card"),h=mk("h2"),l=mk("div","list");
  h.textContent=c.title||"";card.appendChild(h);
  (c.options||[]).forEach(t=>{const o=typeof t==="string"?{label:t}:t,b=mk("button","o");b.textContent=o.label;
    b.onclick=()=>{l.querySelectorAll(".o").forEach(x=>x.disabled=true);o.fn?pick(o.label,o.fn):send(o.label)};l.appendChild(b)});
  card.appendChild(l);r.appendChild(card);down();
}
function renderBot(m){ if(m.reply)botBubble(m); if(m.card)cardBubble(m.card); }
function showTyping(){const r=row("bot");r.innerHTML='<div class="bub"><div class="typing"><span></span><span></span><span></span></div></div>';down();return r}

const dbRpc=async(fn,args,ms=6000)=>{const c=new AbortController(),tm=setTimeout(()=>c.abort(),ms);
  try{const r=await fetch(CONFIG.DB_URL+"/rest/v1/rpc/"+fn,{method:"POST",headers:{apikey:CONFIG.DB_KEY,"Content-Type":"application/json"},body:JSON.stringify(args||{}),cache:"no-store",signal:c.signal});
    if(!r.ok)throw new Error("HTTP "+r.status);return await r.json()}finally{clearTimeout(tm)}};
const fmtTgl=iso=>{try{return new Intl.DateTimeFormat("id-ID",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit",hour12:false,timeZone:"Asia/Jakarta"}).format(new Date(iso)).replace(/\./g,":").replace(" pukul","," )}catch(e){return ""}};
async function getNama(){
  try{
    const d=await dbRpc("get_profil",{},3000);
    const n=((d&&d.nama)||"").trim().toUpperCase();
    if(n)try{localStorage.setItem("profil_cache_v1",JSON.stringify(d))}catch(e){}
    return n;
  }catch(e){
    console.error("[profil]",e);
    try{const c=JSON.parse(localStorage.getItem("profil_cache_v1")||"null");return ((c&&c.nama)||"").trim().toUpperCase()}catch(_){return ""}
  }
}
async function renderWelcome(){
  const tp=showTyping(),nama=await getNama();tp.remove();
  const r=row("bot"),b=mk("div","bub");
  b.textContent=CONFIG.WELCOME.replace(" {nama}",nama?" "+nama:"").replace("{bot}",CONFIG.BOT_NAME);r.appendChild(b);
  if(CONFIG.CATEGORIES.length){
    const cr=mk("div","cats");
    CONFIG.CATEGORIES.forEach(c=>{const b=mk("button","cat");
      b.innerHTML='<i style="background:'+c.color+'">'+(ICONS[c.icon]||ICONS.info)+'</i>';
      const lb=mk("span");lb.textContent=c.label;b.appendChild(lb);
      b.onclick=()=>send(c.label);cr.appendChild(b)});
    msgs.appendChild(cr);
  }
  if(CONFIG.TOPIC_SETS.length){
    const t=row("bot cardrow"),c=mk("div","card"),h=mk("h2"),l=mk("div","list");l.id="tlist";
    h.textContent="Silakan pilih topik yang ingin kamu tanyakan:";
    const s=mk("button","swap",SWAP+"Ganti Pertanyaan");s.id="swap";
    s.onclick=()=>{si=(si+1)%CONFIG.TOPIC_SETS.length;renderTopics()};
    l.appendChild(s);c.append(h,l);t.appendChild(c);
    if(CONFIG.TOPIC_SETS.length<2)s.style.display="none";
    renderTopics();
  }
  CONFIG.CHIPS.forEach(c=>{const b=mk("button");b.textContent=c;b.onclick=()=>send(c);$("chips").appendChild(b)});
  if(!CONFIG.CHIPS.length)$("chips").style.display="none";
}
function renderTopics(){
  const l=$("tlist");l.querySelectorAll(".o").forEach(x=>x.remove());
  CONFIG.TOPIC_SETS[si].forEach(t=>{const b=mk("button","o");b.textContent=t;b.onclick=()=>send(t);l.insertBefore(b,$("swap"))});
}

// ===================== KOMUNIKASI BACKEND =====================
async function callBackend(text){
  if(!CONFIG.ENDPOINT) throw new Error("ENDPOINT belum diisi");
  const headers={"Content-Type":"application/json"};
  if(CONFIG.ANON_KEY){headers.apikey=CONFIG.ANON_KEY;headers.Authorization="Bearer "+CONFIG.ANON_KEY}
  const res=await fetch(CONFIG.ENDPOINT,{method:"POST",headers,
    body:JSON.stringify({session_id:sessionId,message:text,history:history.slice(-CONFIG.HISTORY_LIMIT)})});
  if(!res.ok) throw new Error("HTTP "+res.status);
  const data=await res.json();
  return Array.isArray(data.messages)?data.messages:[data];
}
function sendFeedback(messageId,value,reply){
  const payload={session_id:sessionId,message_id:messageId,value,reply};
  document.dispatchEvent(new CustomEvent("cs:feedback",{detail:payload}));
  if(!CONFIG.FEEDBACK_ENDPOINT)return;
  const h={"Content-Type":"application/json"};
  if(CONFIG.ANON_KEY){h.apikey=CONFIG.ANON_KEY;h.Authorization="Bearer "+CONFIG.ANON_KEY}
  fetch(CONFIG.FEEDBACK_ENDPOINT,{method:"POST",headers:h,body:JSON.stringify(payload)}).catch(()=>{});
}

async function send(text){
  text=(text||"").trim();
  if(!text||busy)return;
  busy=true;
  userBubble(text);history.push({role:"user",content:text});
  $("inp").value="";$("send").classList.remove("on");
  if(text.endsWith(CONFIG.TRIGGER)){busy=false;await say({reply:CONFIG.SPECIAL_ANSWER,feedback:true});return}
  const fl=intent(text);
  if(fl){busy=false;try{await fl()}catch(e){console.error(e)}return}
  const t=showTyping(),t0=Date.now();
  try{
    const out=await callBackend(text);
    await wait(Math.max(0,rnd()-(Date.now()-t0)));
    t.remove();out.forEach(renderBot);
  }catch(e){
    console.error("[chat]",e);t.remove();
    botBubble({reply:"Maaf, pesan belum bisa kami proses saat ini. Silakan coba kirim ulang sebentar lagi."});
  }finally{busy=false}
}

// ===================== ALUR TERPANDU (gaya referensi) =====================
function rich(el,t){t.split("**").forEach((x,i)=>{if(!x)return;if(i%2){const b=document.createElement("b");b.textContent=x;el.appendChild(b)}else el.appendChild(document.createTextNode(x))})}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const rnd=()=>CONFIG.DELAY_MIN+Math.random()*(CONFIG.DELAY_MAX-CONFIG.DELAY_MIN);
async function say(m,ms=rnd()){busy=true;const t=showTyping();await wait(ms);t.remove();renderBot(m);busy=false}
async function pick(label,fn){userBubble(label);history.push({role:"user",content:label});await fn()}
const rp=n=>"Rp "+n.toLocaleString("id-ID");
let flow={};
const intent=t=>{t=t.toLowerCase();
  if(/petugas|manusia|operator|agen cs/.test(t))return handoff;
  if(/dana belum masuk ke rekening tujuan lebih dari 1x24 jam/.test(t))return danaBelumMasuk;
  if(/(belum|tidak).{0,15}(masuk|diterima|sampai)|gagal transfer|terpotong/.test(t))return startTransfer;
  return null};
async function danaBelumMasuk(){
  await say({reply:"Mohon maaf atas kendala yang kamu alami \u{1F64F}"});
  await say({reply:"Jika dana belum masuk ke rekening tujuan setelah menunggu 1x24 jam atau 1 hari kerja, silakan hubungi Customer Service kami di 1500130 atau melalui live chat di Aplikasi SeaBank untuk terhubung ke Customer Service kami agar dibantu pengecekan lebih lanjut."});
  await say({reply:"Semoga kendala yang kamu alami segera teratasi ya \u{1F60A}",feedback:true});
}
async function startTransfer(){
  flow={cat:"transaksi"};
  await say({reply:"Baik, saya bantu telusuri ya.",feedback:true});
  await say({card:{title:"Apakah transaksi tersebut merupakan transaksi keluar dari aplikasi ini?",options:[{label:"Ya",fn:askPick},{label:"Tidak",fn:notOut}]}});
}
const thanks=()=>say({reply:"Baik. Terima kasih sudah menghubungi kami. Ada lagi yang bisa saya bantu?",feedback:true});
const notOut=()=>say({reply:"Baik. Untuk dana masuk yang belum tercatat, ceritakan kendalanya dengan singkat ya, atau pilih Hubungi Petugas.",feedback:true});
const askPick=()=>say({reply:"Mohon maaf atas kendala yang kamu alami. Untuk pengecekan lebih lanjut, silakan pilih transaksi yang ingin kamu tanyakan",feedback:true,action:{label:"Pilih Transaksi",name:"pick_transaction"}});
function txCard(t){const c=mk("div","tx"),a=mk("div","l1"),n=mk("span"),m=mk("span");n.textContent=t.name;m.textContent="-"+rp(t.amount);a.append(n,m);const k=mk("small");k.textContent=t.type;const d=mk("small","d");d.textContent=t.date;c.append(a,k,d);return c}
function closeSheet(){const o=document.querySelector(".sheet");if(!o)return;o.remove();if(window.history.state&&window.history.state.sheet)window.history.back()}
window.addEventListener("popstate",()=>{const o=document.querySelector(".sheet");if(o)o.remove()});
async function openSheet(){
  const o=mk("div","sheet"),p=mk("div"),h=mk("h3");h.textContent="Pilih Transaksi";p.appendChild(h);
  const st=mk("div","tx");st.textContent="Memuat transaksi\u2026";p.appendChild(st);
  o.onclick=e=>{if(e.target===o)closeSheet()};o.appendChild(p);document.querySelector(".app").appendChild(o);
  window.history.pushState({sheet:1},"");
  try{
    const list=await dbRpc("cs_pilih_transaksi",{p_limit:CONFIG.TRANSACTIONS_LIMIT});
    st.remove();
    if(!Array.isArray(list)||!list.length){const e=mk("div","tx");e.textContent="Belum ada transaksi yang tercatat.";p.appendChild(e);return}
    list.forEach(r=>{const t={id:r.id,name:r.name,type:r.type,kind:r.kind,amount:Number(r.amount)||0,date:fmtTgl(r.ts),status:r.status||"berhasil"};
      const b=mk("button");b.appendChild(txCard(t));b.onclick=()=>{closeSheet();chosen(t)};p.appendChild(b)});
  }catch(e){console.error("[log_abc]",e);st.textContent="Transaksi belum bisa dimuat. Tutup lalu coba lagi."}
}
const STAT={
  berhasil:k=>"Berdasarkan pengecekan yang kami lakukan di sistem, transaksi "+k+" kamu sudah berhasil dan terkirim ke tujuan.\n\nJika dalam 1x24 jam pihak tujuan belum menerimanya, silakan hubungi pihak penerima dana dan sebaiknya lakukan konfirmasi ke pihak bank tujuan, karena pengecekan sudah dilakukan dan transaksi dinyatakan telah berhasil terkirim ke pihak tujuan.",
  pending:k=>"Transaksi "+k+" ini masih berstatus diproses. Mohon jangan mengulang transaksi dulu agar tidak terjadi transaksi ganda.",
  gagal:k=>"Transaksi "+k+" ini berstatus gagal. Jika saldo sempat terpotong, pengembaliannya mengikuti ketentuan yang berlaku."
};
async function chosen(t){
  flow.tx=t;const r=row("user"),b=mk("div","bub txb");b.appendChild(txCard(t));r.appendChild(b);down();
  history.push({role:"user",content:"Transaksi "+t.kind+" ke "+t.name+" "+rp(t.amount)});
  await say({reply:"Mohon maaf untuk ketidaknyamanannya. "+STAT[t.status](t.kind)+"\n\nApakah kamu masih mengalami kendala?",feedback:true,
    qr:[{label:"Ya",fn:important},{label:"Tidak",fn:thanks}]});
}
const important=()=>say({reply:"**Penting:**\nKami akan menangani kendala kamu sesuai prosedur yang berlaku.\n\nProses pelaporan membutuhkan waktu maksimal **"+CONFIG.SLA+"**, namun tidak menutup kemungkinan dapat diselesaikan lebih cepat. Itu batas waktu penanganan, bukan jaminan dana masuk pada waktu tersebut.\n\nApakah kamu ingin tetap melanjutkan membuat laporan?",
  qr:[{label:"Ya",fn:()=>makeTicket()},{label:"Tidak",fn:thanks}]});
async function makeTicket(petugas){
  const t=flow.tx;
  const summary=petugas?"Pelanggan meminta dihubungkan dengan petugas customer service.":"Pelanggan melaporkan transaksi "+t.kind+" ke "+t.name+" sebesar "+rp(t.amount)+" pada "+t.date+" (status: "+t.status+"). Pelanggan masih mengalami kendala.";
  try{
    const d=await dbRpc("cs_buat_laporan",{p_session:sessionId,p_category:petugas?"minta_petugas":"transaksi",p_tx_id:(!petugas&&t&&t.id)?t.id:null,p_summary:summary});
    if(!d||!d.ticket_no)throw new Error("tanpa nomor");
    await say({reply:"Laporan kamu sudah dibuat dengan nomor **"+d.ticket_no+"**. "+(petugas?"Transfer langsung ke petugas belum tersedia di chat ini, jadi tindak lanjut dilakukan petugas dari laporan tersebut.":"Petugas akan meninjau laporan ini.")+" Simpan nomor tersebut ya.\n\nAda lagi yang bisa saya bantu?",feedback:true});
  }catch(e){console.error("[laporan]",e);await say({reply:"Maaf, laporan belum berhasil dibuat saat ini. Silakan coba lagi sebentar lagi. Kami tidak akan memberi nomor laporan sebelum benar-benar tercatat."})}
}
const handoff=()=>say({reply:"Baik, saya bantu arahkan ke petugas customer service. Saya buatkan laporan agar kamu tidak perlu mengulang dari awal. Lanjutkan?",
  qr:[{label:"Ya",fn:()=>makeTicket(true)},{label:"Tidak",fn:thanks}]});
document.addEventListener("cs:action",e=>{if(e.detail.action==="pick_transaction")openSheet()});

$("send").onclick=()=>send($("inp").value);
$("inp").addEventListener("input",e=>$("send").classList.toggle("on",e.target.value.trim()!==""));
$("inp").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();send($("inp").value)}});
window.CSChat={send,config:CONFIG,sessionId};   // akses dari luar: CSChat.send("teks")
